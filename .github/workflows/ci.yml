name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version:
          - 22
        pi-version:
          - 0.80.7
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned Pi version
        run: test "$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")" = "${{ matrix.pi-version }}"
      - run: pnpm verify
      - run: pnpm test:e2e
      - run: pnpm pack:validate
