name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version:
          - 22
        pi-version:
          - 0.80.7
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned Pi version
        run: test "$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")" = "${{ matrix.pi-version }}"
      - run: pnpm verify
      - run: pnpm test:e2e
      - name: Validate npm tarball
        run: |
          pnpm pack --json > pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const pack = JSON.parse(fs.readFileSync('pack.json', 'utf8'));
          const paths = pack.files.map((file) => file.path);
          const required = [
            'LICENSE',
            'README.md',
            'THIRD_PARTY_NOTICES.md',
            'package.json',
            'src/index.ts',
            'docs/behavior-contract.md',
            'docs/omp-parity.md',
          ];
          for (const path of required) {
            if (!paths.includes(path)) throw new Error(`Missing packed file: ${path}`);
          }
          const forbidden = paths.filter((path) =>
            path === 'CONTEXT.md' ||
            path.startsWith('docs/internal/') ||
            path.startsWith('tests/') ||
            path.startsWith('scripts/')
          );
          if (forbidden.length > 0) throw new Error(`Forbidden packed files: ${forbidden.join(', ')}`);
          NODE
